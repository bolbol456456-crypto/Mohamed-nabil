<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الكابتن</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f0f0f; color: #fff; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #444; padding: 12px; text-align: center; }
        th { background: #ffaa00; color: #000; }
        video, img { max-width: 150px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>لوحة تحكم كابتن محمد نبيل - متابعة العملاء</h1>
    <table>
        <tr>
            <th>اسم الملف / الوسائط</th>
            <th>نوع الملف</th>
            <th>الإجراء</th>
        </tr>
        {% for file in files %}
        <tr>
            <td>{{ file }}</td>
            <td>
                {% if file.endswith(('png', 'jpg', 'jpeg')) %}
                    <img src="{{ url_for('static', filename='uploads/' + file) }}" alt="صورة العميل">
                {% elif file.endswith(('mp4', 'mov', 'avi')) %}
                    <video controls>
                        <source src="{{ url_for('static', filename='uploads/' + file) }}" type="video/mp4">
                    </video>
                {% endif %}
            </td>
            <td><a href="{{ url_for('static', filename='uploads/' + file) }}" target="_blank" style="color: #ffaa00;">فتح الملف كامل</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
